  class_imbalance: weighted_loss
  num_workers: 2
  num_workers: 2
  num_workers: 2

quantum:
  n_qubits: 4
  n_layers: 2
  sim_device: lightning.qubit
  init_std: 0.01

paths:
  results_dir: experiments/results
  weights_dir: weights
