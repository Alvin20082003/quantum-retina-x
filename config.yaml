seed: 42

data:
  image_size: 224
  num_classes: 5
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std:  [0.229, 0.224, 0.225]
  paths:
    messidor: ""
    eyepacs:  ""
    aptos:    ""
    idrid:    ""

train:
  batch_size: 8
  epochs: 20
  lr_backbone: 3.0e-5
